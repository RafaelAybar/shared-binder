services:
  web-server:
    container_name: web-server
    image: nginx:1.31.7
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
    profiles:
      - full
  postgres:
    image: postgres:19
    container_name: databases
    env_file: env-files-examples/postgres-backend-example.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    profiles:
      - db
      - backend
      - full

volumes:
  postgres_data:
