# Análisis de SonarQube Cloud. Lo lanza .github/workflows/sonarqube.yml; ver
# docs/procesos/analisis-calidad.md.

# Los dos valores están en la página Information del proyecto en SonarQube Cloud.
sonar.organization=rafaelaybar
sonar.projectKey=RafaelAybar_shared-binder
sonar.projectName=Shared Binder

sonar.sourceEncoding=UTF-8

# PHP (la aplicación Laravel), el frontend (TypeScript, JavaScript, CSS y Svelte), Python (el
# ETL), el Dockerfile y docker-compose. El SQL no se analiza.
sonar.sources=shared-binder,python-scripts,backend.Dockerfile,docker-compose.yaml
sonar.inclusions=\
  **/*.php,\
  **/*.ts,\
  **/*.js,\
  **/*.css,\
  **/*.svelte,\
  **/*.py,\
  backend.Dockerfile,\
  docker-compose.yaml
sonar.tests=shared-binder/tests,python-scripts/tests
sonar.test.inclusions=**/*.php,**/*.py

# Dependencias, ficheros generados (por Laravel, Wayfinder y Vite) y plantillas Blade (HTML
# con directivas, no PHP). Los tests están dentro de las carpetas de código, y SonarQube no
# admite que un fichero sea a la vez código y test.
sonar.exclusions=\
  shared-binder/vendor/**,\
  shared-binder/node_modules/**,\
  shared-binder/storage/**,\
  shared-binder/bootstrap/cache/**,\
  shared-binder/bootstrap/ssr/**,\
  shared-binder/public/build/**,\
  shared-binder/resources/js/actions/**,\
  shared-binder/resources/js/routes/**,\
  shared-binder/resources/js/wayfinder/**,\
  **/*.blade.php,\
  shared-binder/tests/**,\
  python-scripts/tests/**

# La versión mínima del ETL (docs/procesos/ingesta.md).
sonar.python.version=3.14

# Sin esto, SonarQube busca todos los tsconfig.json del repositorio.
sonar.typescript.tsconfigPaths=shared-binder/tsconfig.json

# SonarQube no admite Svelte: los componentes se analizan como HTML, con las reglas del
# marcado (accesibilidad, atributos...). El TypeScript de <script> no se analiza.
sonar.html.file.suffixes=.html,.svelte

# Los patrones por defecto son Dockerfile, Dockerfile.* y *.dockerfile. Se añade *.Dockerfile
# por si distinguen mayúsculas: así backend.Dockerfile se analiza con las reglas de Docker.
sonar.lang.patterns.docker=**/Dockerfile,**/Dockerfile.*,**/*.dockerfile,**/*.Dockerfile

# SonarQube no tiene reglas para Docker Compose. En docker-compose.yaml solo se buscan
# secretos (contraseñas, tokens...), y para eso tiene que estar en sonar.text.inclusions.
sonar.text.inclusions.activate=true
sonar.text.inclusions=docker-compose.yaml
